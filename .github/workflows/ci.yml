name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tools/tests -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: A fresh repo builds, validates and commits
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          python3 tools/tars.py init /tmp/memory --home /tmp/fakehome
          python3 tools/tars.py --json doctor /tmp/memory --home /tmp/fakehome | tee /tmp/doctor.json
          python3 -c "import json;d=json.load(open('/tmp/doctor.json'));assert d['data']['claude_wired'],'not wired';assert not d['data']['awakened'],'should be un-woken'"
          git -C /tmp/memory add -A
          git -C /tmp/memory commit -m "ci" --quiet
      - name: The hook refuses a threshold with a rule removed
        run: |
          cd /tmp/memory
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CLAUDE.md")
          p.write_text(p.read_text().replace("FIX THE PRODUCER", "do stuff"))
          PY
          git add -A
          if git commit -m "should not land"; then echo "hook did not fire"; exit 1; fi
          git checkout -- CLAUDE.md
          echo "hook blocked it"

      - name: A credential cannot be committed, and cannot be pushed past --no-verify
        run: |
          cd /tmp/memory
          git init -q --bare /tmp/remote && git remote add origin /tmp/remote
          echo "prod key AKIA""IOSFODNN7EXAMPLE" > memory/leak.md
          git add -A
          if git commit -m "should not land"; then echo "pre-commit missed a credential"; exit 1; fi
          git commit -q --no-verify -m "bypassed the first line"
          if git push -q origin main; then echo "pre-push missed a credential"; exit 1; fi
          test "$(git --git-dir=/tmp/remote rev-list --all --count)" = "0"
          echo "nothing reached the remote"

  secrets:
    # The scanner runs against its own source. A security tool that never eats its own
    # cooking is a security tool nobody should trust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: No credential in the working tree
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'tools')
          import tars, pathlib
          found = tars.scan_secrets(pathlib.Path('.'))
          for rel, line, label in found: print(f'{rel}:{line} {label}')
          sys.exit(1 if found else 0)"
      - name: No credential anywhere in history
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          sys.path.insert(0, "tools")
          import tars
          blobs = subprocess.run(["git", "rev-list", "--objects", "--all"],
                                 capture_output=True, text=True, check=True).stdout
          names = {}
          for line in blobs.splitlines():
              sha, _, name = line.partition(" ")
              if name:
                  names[sha] = name
          batch = subprocess.run(["git", "cat-file", "--batch-all-objects", "--batch",
                                  "--buffer", "--unordered"],
                                 capture_output=True, check=True).stdout.decode("utf-8", "replace")
          hits = []
          for label, pattern in tars.SECRET_PATTERNS:
              for match in pattern.finditer(batch):
                  line = batch[:match.start()].rfind("\n")
                  context = batch[line + 1:batch.find("\n", match.end())]
                  if tars.SECRET_PRAGMA not in context:
                      hits.append(label)
          if hits:
              print("credential shapes found in history:", ", ".join(sorted(set(hits))))
              sys.exit(1)
          print(f"clean: {len(names)} named objects across every commit")
          PY

  bootstrap:
    # The README promises that a git URL and a shell are the whole dependency list.
    # This job is that promise, run against a clone rather than the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: A clone of this commit installs itself with nothing but git and python
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git clone -q "$GITHUB_WORKSPACE" /tmp/src
          test -f /tmp/src/AGENTS.md
          test "$(python3 /tmp/src/tools/tars.py --version)" = "$(cat VERSION)"
          HOME=/tmp/bootstrap-home python3 /tmp/src/tools/tars.py init /tmp/bootstrap-home/tars
          HOME=/tmp/bootstrap-home python3 /tmp/src/tools/tars.py --json doctor | tee /tmp/found.json
          python3 -c "import json;d=json.load(open('/tmp/found.json'))['data'];assert d['repo']=='/tmp/bootstrap-home/tars',d['repo'];assert d['claude_wired'];print('found the repo through the wiring alone')"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Plugin manifest carries what a release needs
        run: |
          python3 - <<'PY'
          import json, pathlib
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          for key in ("name", "version", "description", "license", "skills"):
              assert key in plugin, f"plugin.json missing {key}"
          print("ok:", plugin["name"], plugin["version"])
          PY

      - name: The marketplace is what the registry projects
        run: python3 tools/registry.py --check

      - name: The registry agrees with what is on disk
        run: python3 -m unittest tools.tests.test_tars.TestMarketplace tools.tests.test_tars.TestRegistry -v
